# PostgreSQL for the Wethaq API (local development). Start with: npm run db:up
services:
  postgres:
    image: postgres:16-alpine
    container_name: wethaq-api-db
    environment:
      POSTGRES_USER: wethaq
      POSTGRES_PASSWORD: wethaq
      POSTGRES_DB: wethaq
    ports:
      - "127.0.0.1:5434:5432"   # 5434 on the host, so it does not clash with another local PostgreSQL
    volumes:
      - wethaq-api-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wethaq -d wethaq"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The API in a container (optional): docker compose --profile api up -d --build
  # Uses the local development ledger unless LEDGER_MODE=fabric is set; for Fabric see ../fabric/README.md.
  api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: wethaq-api/Dockerfile
    container_name: wethaq-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wethaq:wethaq@postgres:5432/wethaq
      # Required: a random value of at least 32 characters, for example from `openssl rand -hex 32`.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the shell or in wethaq-api/.env}
      NODE_ENV: ${NODE_ENV:-production}
      LEDGER_MODE: ${LEDGER_MODE:-local}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:4000:4000"
volumes:
  wethaq-api-pgdata:
