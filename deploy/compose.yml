# Wethaq on one Linux virtual machine: PostgreSQL, the API (Fabric mode) and a Caddy web server that serves
# the live-mode dashboard and forwards /api to the API, with automatic HTTPS for a real domain name.
#
# This file is a prepared configuration, not a record of a deployment. Nothing has been deployed with it.
# The Fabric network runs on the same machine (fabric/up.sh), in its Docker network fabric_test.
# See docs/gp482/DEPLOYMENT_GUIDE.md, section "One virtual machine", for the full procedure.
#
#   cp deploy/production.env.example deploy/production.env    # then fill in the values (never commit it)
#   VITE_WETHAQ_LIVE=true npx vite build --outDir dist-live     # from the repository root
#   docker compose -f deploy/compose.yml --env-file deploy/production.env up -d --build
#   docker compose -f deploy/compose.yml --env-file deploy/production.env exec api \
#     node_modules/.bin/tsx src/cli/bootstrap.ts --admin-email <email> --admin-name "<name>"
name: wethaq

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: wethaq
      POSTGRES_DB: wethaq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/production.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published on the host: only the API reaches the database.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wethaq -d wethaq"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    image: ${API_IMAGE:-wethaq-api:latest}
    build:
      context: ..
      dockerfile: wethaq-api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://wethaq:${POSTGRES_PASSWORD}@postgres:5432/wethaq
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/production.env}
      JWT_TTL: ${JWT_TTL:-8h}
      TEMP_PASSWORD_HOURS: ${TEMP_PASSWORD_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LEDGER_MODE: ${LEDGER_MODE:-fabric}
      FABRIC_TEST_NETWORK: /fabric/test-network
      FABRIC_IDENTITY_DIR: /fabric/identities
      FABRIC_APP_USER: ${FABRIC_APP_USER:-wethaq-app}
      FABRIC_ORG1_ENDPOINT: peer0.org1.example.com:7051
      FABRIC_ORG2_ENDPOINT: peer0.org2.example.com:9051
    volumes:
      # Only the two peers' TLS CA certificates (public), not the organizations folder with the peers' keys.
      - ${FABRIC_ORGANIZATIONS_DIR:-../fabric/fabric-samples/test-network/organizations}/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt:/fabric/test-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt:ro
      - ${FABRIC_ORGANIZATIONS_DIR:-../fabric/fabric-samples/test-network/organizations}/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt:/fabric/test-network/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt:ro
      # The API's enrolled identities (private keys): readable by the container user (uid 1000) and no one else.
      - ${FABRIC_IDENTITY_HOST_DIR:-../fabric/identities}:/fabric/identities:ro
    # Not published on the host: the web server forwards /api to it.
    networks: [internal, fabric]

  web:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    depends_on: [api]
    environment:
      # A domain name (for example wethaq.example.edu) gives automatic HTTPS; http://:80 serves plain HTTP.
      WETHAQ_SITE_ADDRESS: ${WETHAQ_SITE_ADDRESS:?set WETHAQ_SITE_ADDRESS in deploy/production.env}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DASHBOARD_DIR:-../dist-live}:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

networks:
  internal: {}
  # The Fabric test network's Docker network, created by fabric/up.sh.
  fabric:
    name: ${FABRIC_DOCKER_NETWORK:-fabric_test}
    external: true

volumes:
  pgdata: {}
  caddy-data: {}
  caddy-config: {}
