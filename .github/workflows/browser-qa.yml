name: Responsive browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    name: E2E · mobile, tablet and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js with the npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx playwright install chromium
      - name: Run responsive tests
        run: npm run test:ui
      - name: Store screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wethaq-responsive-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  live:
    name: E2E · live mode against the API (in-memory database, local development ledger)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js with the npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wethaq-api/package-lock.json
      - name: Install
        run: |
          npm install --no-audit --no-fund
          (cd wethaq-api && npm ci --no-audit --no-fund)
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run the live-mode tests (sign-in, roles, ledger operations, sign-out, ended sessions, API unreachable)
        run: npm run test:live
      - name: Store traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wethaq-live-e2e
          path: test-results/
          retention-days: 7
