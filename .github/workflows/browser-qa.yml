name: Responsive browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    name: E2E · mobile, tablet and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js with the npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx playwright install chromium
      - name: Run responsive tests
        run: npm run test:ui
      - name: Store screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wethaq-responsive-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  live:
    name: E2E · live mode against the API (in-memory database, local development ledger)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js with the npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wethaq-api/package-lock.json
      - name: Install
        run: |
          npm install --no-audit --no-fund
          (cd wethaq-api && npm ci --no-audit --no-fund)
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run the live-mode tests (sign-in, roles, ledger operations, sign-out, ended sessions, API unreachable)
        run: npm run test:live
      - name: Store traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wethaq-live-e2e
          path: test-results/
          retention-days: 7
