name: Responsive browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    name: E2E · mobile, tablet and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx playwright install chromium
      - name: Run responsive tests
        run: npm run test:ui
      - name: Store screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wethaq-responsive-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 7
