name: Fabric integration (manual)
# Runs the API against a real Hyperledger Fabric test network (Fabric 2.5, Fabric CA 1.5) on the runner.
# Manual only: it downloads the Fabric images and takes several minutes. Nothing is deployed anywhere.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgres://wethaq:wethaq@127.0.0.1:5432/wethaq
      LEDGER_MODE: fabric
      DEMO_PASSWORD: ci-demo-password-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start PostgreSQL 16 (Docker Hub, then the public.ecr.aws and mirror.gcr.io copies; bounded attempts)
        run: |
          set -e
          PG_IMAGE=$(.github/scripts/pull-image.sh postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine mirror.gcr.io/library/postgres:16-alpine)
          docker run -d --name wethaq-pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=wethaq -e POSTGRES_PASSWORD=wethaq -e POSTGRES_DB=wethaq "$PG_IMAGE"
          for i in $(seq 1 60); do docker exec wethaq-pg pg_isready -h 127.0.0.1 -U wethaq -q && break; sleep 1; done
          docker exec wethaq-pg pg_isready -h 127.0.0.1 -U wethaq
      - name: Sign in to Docker Hub when credentials are configured (base images; Fabric images come from ghcr.io first, Docker Hub second)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "No Docker Hub credentials configured: anonymous pulls (rate-limited by Docker Hub)"
          fi
      - name: Set up Node.js with the npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wethaq-api/package-lock.json
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          (cd wethaq-api && npm ci --no-audit --no-fund)
      - name: Pull the chaincode's base image (Docker Hub, then the public.ecr.aws and mirror.gcr.io copies; bounded attempts)
        run: echo "WETHAQ_NODE_IMAGE=$(.github/scripts/pull-image.sh node:20-bookworm-slim public.ecr.aws/docker/library/node:20-bookworm-slim mirror.gcr.io/library/node:20-bookworm-slim)" >> "$GITHUB_ENV"
      - name: Install Fabric
        run: ./fabric/install.sh
      - name: Start the network (CA, channel, chaincode, identities) and verify it
        run: ./fabric/up.sh
      - name: Seed through the ledger
        working-directory: wethaq-api
        run: npm run migrate && npm run seed -- --reset
      - name: Start the API
        working-directory: wethaq-api
        run: |
          JWT_SECRET=$(openssl rand -hex 32) nohup npm start > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:4000/api/health/ready && break; sleep 2; done
      - name: Fabric integration tests
        working-directory: wethaq-api
        run: npm run test:fabric
      - name: Non-functional checks (after the one-minute sign-in rate-limit window used by the tests above)
        working-directory: wethaq-api
        run: sleep 65 && npm run nfr
      - name: End-to-end browser test on Fabric (the test starts and restarts the API itself)
        run: |
          pkill -f "src/server.ts" || true
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.fabric.config.ts
      - name: Store logs and the NFR report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wethaq-fabric-run
          path: |
            wethaq-api/api.log
            wethaq-api/nfr-results/
          retention-days: 7
      - name: Stop the network and PostgreSQL
        if: always()
        run: |
          ./fabric/reset.sh --yes
          docker rm -f wethaq-pg >/dev/null 2>&1 || true
