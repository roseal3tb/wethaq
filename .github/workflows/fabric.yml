name: Fabric integration (manual)
# Runs the API against a real Hyperledger Fabric test network (Fabric 2.5, Fabric CA 1.5) on the runner.
# Manual only: it downloads the Fabric images and takes several minutes. Nothing is deployed anywhere.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: wethaq
          POSTGRES_PASSWORD: wethaq
          POSTGRES_DB: wethaq
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U wethaq" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://wethaq:wethaq@127.0.0.1:5432/wethaq
      LEDGER_MODE: fabric
      DEMO_PASSWORD: ci-demo-password-1
      # The chaincode image's Node.js base image comes from the ECR Public mirror of Docker Hub's library.
      WETHAQ_NODE_IMAGE: public.ecr.aws/docker/library/node:20-bookworm-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Sign in to Docker Hub when credentials are configured (the Fabric images come from Docker Hub)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "No Docker Hub credentials configured: anonymous pulls (rate-limited by Docker Hub)"
          fi
      - name: Set up Node.js with the npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wethaq-api/package-lock.json
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          (cd wethaq-api && npm ci --no-audit --no-fund)
      - name: Install Fabric
        run: ./fabric/install.sh
      - name: Start the network (CA, channel, chaincode, identities) and verify it
        run: ./fabric/up.sh
      - name: Seed through the ledger
        working-directory: wethaq-api
        run: npm run migrate && npm run seed -- --reset
      - name: Start the API
        working-directory: wethaq-api
        run: |
          JWT_SECRET=$(openssl rand -hex 32) nohup npm start > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:4000/api/health/ready && break; sleep 2; done
      - name: Fabric integration tests
        working-directory: wethaq-api
        run: npm run test:fabric
      - name: Non-functional checks
        working-directory: wethaq-api
        run: npm run nfr
      - name: End-to-end browser test on Fabric (the test starts and restarts the API itself)
        run: |
          pkill -f "src/server.ts" || true
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.fabric.config.ts
      - name: Store logs and the NFR report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wethaq-fabric-run
          path: |
            wethaq-api/api.log
            wethaq-api/nfr-results/
          retention-days: 7
      - name: Stop the network
        if: always()
        run: ./fabric/reset.sh --yes
